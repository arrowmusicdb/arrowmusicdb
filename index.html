<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Music OS</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

<header>

<div class="logo">
    <img src="logo.png" alt="Arrow Music">
</div>

<div class="title">
    <h1>ARROW MUSIC OS</h1>
    <p>Turning Ideas Into Hits</p>
</div>

<div class="clock">
    <div id="time">00:00:00</div>
    <div id="date">Loading...</div>
</div>

</header>

<main>

<section class="left">

<div class="card">
<h2>NOW RECORDING</h2>
<h1>READY</h1>
<p>Waiting for Artist...</p>
</div>

<div class="card">
<h2>STUDIO STATUS</h2>

<p>🎙 Mic : Ready</p>
<p>🎧 Headphones : Connected</p>
<p>💻 Logic Pro : Online</p>
<p>🌐 Internet : Connected</p>

</div>

</section>

<section class="center">

<div class="logo-big">
<img src="logo.png">
</div>

<div class="visualizer">

<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>

</div>

</section>

<section class="right">

<div class="card">
<h2>TODAY'S SCHEDULE</h2>

<p>10:00 Recording</p>

<p>2:00 Mixing</p>

<p>7:00 Mastering</p>

</div>

<div class="card">

<h2>WEATHER</h2>

<p id="weather">Loading...</p>

</div>

</section>

</main>

<script src="app.js"></script>

</body>

</html>
